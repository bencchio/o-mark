# Page format: the size of the sheet, on screen and in the exported PDF.
# Values: "a3" | "a4" | "a5". A document can declare its own with `page_format:`
# in its front matter, which wins over this default.
page_format = "a4"

# Page orientation of the sheet. Values: "portrait" | "landscape".
# A document can declare its own with `page_orientation:` in its front matter.
# Ctrl+R flips it for the session only; this default changes only by editing it here.
page_orientation = "portrait"

# Margin above and below the content of every page of the exported PDF, in mm (0-50).
pdf_margin_vertical = "25mm"

# Margin left and right of the content of every page of the exported PDF, in mm (0-50).
# It does not change the screen.
pdf_margin_horizontal = "10mm"

# Zoom at launch, and what Ctrl+0 and the toolbar reset return to. 1.0 is 100 %;
# values from 0.5 to 2.0. It is not saved between sessions.
zoom_default = 1.0

# Font of the document: "mono" is the Omarchy mono font; or a CSS font stack such as
# "Inter, Liberation Sans, sans-serif" (letters, digits, spaces, commas, quotes, dots,
# hyphens and underscores only).
font = "mono"

# Base document font size. "default" = the size of the base layout;
# or a size in px (e.g. "16" or "17px").
font_size = "default"

# Treatment the viewer starts with, applied on top of the active Omarchy theme.
# The names come from omarchy-lib-theme, in lowercase: "original" | "inverted" |
# "highcontrast" | "mono" | "print", and any the installed library adds. An unknown
# name is Original. Overwritten on quit with the treatment active in the session.
viewer_treatment = "original"

# Show the native browser scrollbars (WebEngineView).
show_scrollbars = false

# Show line numbers on code blocks. Single-line blocks never show them.
code_line_numbers = true

# Toolbar position: "top" | "bottom".
toolbar_position = "bottom"

# Toolbar visibility at launch. Overwritten on quit with the session state (Esc).
toolbar_visible = false
