# Tema del visor al arrancar. Se sobrescribe al salir con el tema activo de la sesión.
# Valores: "system" (paleta Omarchy) | "github" | "writer" | "night" | "sepia" | "mono" | "minimal"
viewer_theme = "github"

# Ancho máximo del cuerpo del documento. "default" = tomar el ancho que define
# cada tema; o una longitud CSS (mm, px, %, ch...).
document_max_width = "default"

# Tamaño de fuente base del documento. "default" = tomar la fuente que define
# cada tema; o un tamaño en px (ej. "16" o "17px").
font_size_base = "default"

# Muestra las barras de scroll nativas del navegador (WebEngineView).
show_scrollbars = false

# Posición del toolbar: "top" | "bottom".
toolbar_position = "bottom"

# Visibilidad del toolbar al arrancar. Se sobrescribe al salir con el estado de la sesión (Esc).
toolbar_visible = false
