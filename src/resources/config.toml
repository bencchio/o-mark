# Viewer theme at launch. Overwritten on quit with the theme active in the session.
# Values: "system" (Omarchy palette) | "github" | "writer" | "night" | "sepia" | "mono" | "minimal"
viewer_theme = "github"

# Page format. Only "a4" exists for now; it sets the width and height of the sheet
# on screen and in the exported PDF.
page_format = "a4"

# Page orientation at launch. Overwritten on quit with the session state (Ctrl+R).
# Values: "portrait" | "landscape"
page_orientation = "portrait"

# Base document font size. "default" = use the size each theme defines;
# or a size in px (e.g. "16" or "17px").
font_size_base = "default"

# Show the native browser scrollbars (WebEngineView).
show_scrollbars = false

# Show line numbers on code blocks. Single-line blocks never show them.
code_line_numbers = true

# Toolbar position: "top" | "bottom".
toolbar_position = "bottom"

# Toolbar visibility at launch. Overwritten on quit with the session state (Esc).
toolbar_visible = false
